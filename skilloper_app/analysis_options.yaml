include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - ".dart_tool/**"
  errors:
    # Treat these as info instead of warnings
    inference_failure_on_instance_creation: info
    inference_failure_on_collection_literal: info
    inference_failure_on_untyped_parameter: info
    inference_failure_on_function_invocation: info

linter:
  rules:
    # Disabled - not a library, no need for public API docs
    public_member_api_docs: false

    # Disabled - modern screens can handle longer lines
    lines_longer_than_80_chars: false

    # Disabled - allow regular TODOs
    flutter_style_todos: false

    # Disabled - style preferences (can enable later for stricter checks)
    prefer_single_quotes: false
    always_use_package_imports: false
    cascade_invocations: false
    avoid_redundant_argument_values: false
    sort_constructors_first: false
    omit_local_variable_types: false
    sort_pub_dependencies: false
    avoid_dynamic_calls: false
    prefer_int_literals: false
    use_string_buffers: false
